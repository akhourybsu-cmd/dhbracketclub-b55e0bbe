name: Draft Arena mobile browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-mobile-browser.yml'
      - 'src/components/draft/**'
      - 'src/components/drafts/**'
      - 'src/components/EnrichedItemCard.tsx'
      - 'src/lib/draft/scroll.ts'
      - 'src/pages/DraftDetailPage.tsx'
      - 'src/pages/DraftsListPage.tsx'
      - 'src/pages/LiveDraftsPage.tsx'
      - 'src/pages/CreateDraftPage.tsx'
      - 'scripts/check-draft-arena.mjs'
      - 'scripts/fixtures/draft-arena*'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      DRAFT_QA_OUTPUT: /tmp/draft-mobile-browser-artifacts
      DRAFT_QA_SECTION: mobile-scroll
      DRAFT_QA_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare browser artifacts
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.DRAFT_QA_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'context.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, engine: process.env.DRAFT_QA_BROWSER,
            section: process.env.DRAFT_QA_SECTION, node: process.version,
          }, null, 2));
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Select installed Chromium
        if: matrix.engine == 'chromium'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          appendFileSync(process.env.GITHUB_ENV, `DRAFT_QA_CHROMIUM=${chromium.executablePath()}\n`);
          JS

      - name: Check mobile pick layouts and scroll ownership
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s node scripts/check-draft-arena.mjs 2>&1 | tee "$DRAFT_QA_OUTPUT/runner.log"

      - name: Read browser result
        if: always()
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.DRAFT_QA_OUTPUT, 'report.json');
          if (!fs.existsSync(file)) console.log('No browser report produced; inspect the preceding step.');
          else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({ engine: report.browser, checks: report.checks.length,
              errors: report.errors, runtimeErrors: report.runtimeErrors }, null, 2));
          }
          JS

      - name: Upload mobile review frames and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-mobile-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DRAFT_QA_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7

  regression:
    name: Existing Draft Arena journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DRAFT_QA_OUTPUT: /tmp/draft-regression-browser-artifacts
      DRAFT_QA_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare browser artifacts
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.DRAFT_QA_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'context.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, engine: 'chromium',
            section: 'all', node: process.version,
          }, null, 2));
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Select installed Chromium
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          appendFileSync(process.env.GITHUB_ENV, `DRAFT_QA_CHROMIUM=${chromium.executablePath()}\n`);
          JS

      - name: Check existing desktop, live, projector and mobile journeys
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 1200s node scripts/check-draft-arena.mjs 2>&1 | tee "$DRAFT_QA_OUTPUT/runner.log"

      - name: Read browser result
        if: always()
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.DRAFT_QA_OUTPUT, 'report.json');
          if (!fs.existsSync(file)) console.log('No browser report produced; inspect the preceding step.');
          else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({ engine: report.browser, checks: report.checks.length,
              errors: report.errors, runtimeErrors: report.runtimeErrors }, null, 2));
          }
          JS

      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DRAFT_QA_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compact regression report and failure frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-regression-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/draft-regression-browser-artifacts/report.json
            /tmp/draft-regression-browser-artifacts/context.json
            /tmp/draft-regression-browser-artifacts/failure.png
            /tmp/draft-regression-browser-artifacts/*-failure.png
            /tmp/draft-regression-browser-artifacts/*-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
