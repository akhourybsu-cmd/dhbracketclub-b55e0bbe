name: Draft Arena mobile browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-mobile-browser.yml'
      - 'src/components/draft/**'
      - 'src/components/drafts/**'
      - 'src/components/EnrichedItemCard.tsx'
      - 'src/lib/draft/**'
      - 'src/pages/DraftDetailPage.tsx'
      - 'src/pages/DraftsListPage.tsx'
      - 'src/pages/LiveDraftsPage.tsx'
      - 'src/pages/CreateDraftPage.tsx'
      - 'scripts/check-draft-arena.mjs'
      - 'scripts/fixtures/draft-arena*'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, section: mobile-scroll, label: mobile }
          - { engine: webkit, section: mobile-scroll, label: mobile }
          - { engine: chromium, section: keyboard, label: keyboard }
          - { engine: webkit, section: keyboard, label: keyboard }
    name: ${{ matrix.label }} (${{ matrix.engine }})
    env:
      DRAFT_QA_OUTPUT: /tmp/draft-mobile-browser-artifacts
      DRAFT_QA_SECTION: ${{ matrix.section }}
      DRAFT_QA_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare browser artifacts
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.DRAFT_QA_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'context.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, engine: process.env.DRAFT_QA_BROWSER,
            section: process.env.DRAFT_QA_SECTION, node: process.version,
          }, null, 2));
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Select installed Chromium
        if: matrix.engine == 'chromium'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          appendFileSync(process.env.GITHUB_ENV, `DRAFT_QA_CHROMIUM=${chromium.executablePath()}\n`);
          JS

      - name: Check mobile layouts, scroll ownership and keyboard geometry
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s node scripts/check-draft-arena.mjs 2>&1 | tee "$DRAFT_QA_OUTPUT/runner.log"

      - name: Read browser result
        if: always()
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.DRAFT_QA_OUTPUT, 'report.json');
          if (!fs.existsSync(file)) console.log('No browser report produced; inspect the preceding step.');
          else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({ engine: report.browser, checks: report.checks.length,
              errors: report.errors, runtimeErrors: report.runtimeErrors }, null, 2));
          }
          JS

      - name: Upload mobile review frames and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ matrix.label }}-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DRAFT_QA_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7

  regression:
    name: Existing Draft Arena journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DRAFT_QA_OUTPUT: /tmp/draft-regression-browser-artifacts
      DRAFT_QA_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare browser artifacts
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.DRAFT_QA_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'context.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, engine: 'chromium',
            section: 'all', node: process.version,
          }, null, 2));
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Select installed Chromium
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          appendFileSync(process.env.GITHUB_ENV, `DRAFT_QA_CHROMIUM=${chromium.executablePath()}\n`);
          JS

      - name: Check existing desktop, live, projector and mobile journeys
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 1200s node scripts/check-draft-arena.mjs 2>&1 | tee "$DRAFT_QA_OUTPUT/runner.log"

      - name: Read browser result
        if: always()
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.DRAFT_QA_OUTPUT, 'report.json');
          if (!fs.existsSync(file)) console.log('No browser report produced; inspect the preceding step.');
          else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({ engine: report.browser, checks: report.checks.length,
              errors: report.errors, runtimeErrors: report.runtimeErrors }, null, 2));
          }
          JS

      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DRAFT_QA_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compact regression report and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-regression-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/draft-regression-browser-artifacts/report.json
            /tmp/draft-regression-browser-artifacts/context.json
            /tmp/draft-regression-browser-artifacts/failure.png
            /tmp/draft-regression-browser-artifacts/*-failure.png
            /tmp/draft-regression-browser-artifacts/*-diagnostics.json
            /tmp/draft-regression-browser-artifacts/initial-active-room.png
            /tmp/draft-regression-browser-artifacts/initial-lobby.png
            /tmp/draft-regression-browser-artifacts/live-ceremony-20-players-320x568-early.png
            /tmp/draft-regression-browser-artifacts/live-ceremony-20-players-320x568-last-lineup.png
            /tmp/draft-regression-browser-artifacts/390x844-*-active.png
            /tmp/draft-regression-browser-artifacts/390x844-*-complete.png
            /tmp/draft-regression-browser-artifacts/commissioner-gallery-320x568-light-overview.png
            /tmp/draft-regression-browser-artifacts/commissioner-gallery-320x568-light-planner.png
            /tmp/draft-regression-browser-artifacts/commissioner-gallery-1440x900-dark-overview.png
            /tmp/draft-regression-browser-artifacts/stress-320x568-dark-large-board.png
            /tmp/draft-regression-browser-artifacts/stress-320x568-dark-last-log-pick.png
            /tmp/draft-regression-browser-artifacts/live-greenroom-player-before-join.png
            /tmp/draft-regression-browser-artifacts/live-greenroom-host-alone.png
            /tmp/draft-regression-browser-artifacts/live-order-ceremony.png
            /tmp/draft-regression-browser-artifacts/live-other-player-receives-first-pick.png
            /tmp/draft-regression-browser-artifacts/live-320x568-no-preference-workspace.png
            /tmp/draft-regression-browser-artifacts/live-390x844-reduce-workspace.png
            /tmp/draft-regression-browser-artifacts/live-844x390-no-preference-workspace.png
          if-no-files-found: warn
          retention-days: 7
