name: Draft Arena public deployment proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/draft-arena-release.json'
      - 'scripts/check-draft-mobile-publication.mjs'
      - 'scripts/check-draft-mobile-publication.test.mjs'
      - '.github/workflows/draft-mobile-publication.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DRAFT_PUBLICATION_OUTPUT: /tmp/draft-mobile-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check verifier without network
        run: node --test scripts/check-draft-mobile-publication.test.mjs
      - name: Record release-check context
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.DRAFT_PUBLICATION_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'context.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version,
          }, null, 2));
          JS
      - name: Verify hosted Arena assets with normal TLS
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 300s node scripts/check-draft-mobile-publication.mjs 2>&1 | tee "$DRAFT_PUBLICATION_OUTPUT/runner.log"
      - name: Upload independent public receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-mobile-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DRAFT_PUBLICATION_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
