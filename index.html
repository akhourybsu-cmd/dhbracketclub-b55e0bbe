    <style>
      /* Pre-React splash to avoid white flash on installed PWA cold launch. */
      html, body { background: #0D1210; }
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #0D1210;
      }
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        margin: -16px 0 0 -16px;
        border: 2px solid rgba(255,255,255,0.12);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: dh-spin 0.8s linear infinite;
      }
      html:is([data-mesomon-console], [data-pocket-console]), html:is([data-mesomon-console], [data-pocket-console]) body,
      html:is([data-mesomon-console], [data-pocket-console]) #root:empty::before { background: #102224; }
      html:is([data-mesomon-console], [data-pocket-console]) #root:empty::after { border-top-color: #d4bc7c; }
      html:is([data-mesomon-console], [data-pocket-console]) [data-sonner-toaster] { display: none; }
      @media (prefers-reduced-motion: reduce) {
        html:is([data-mesomon-console], [data-pocket-console]) #root:empty::after { animation: none; }
      }
      @keyframes dh-spin { to { transform: rotate(360deg); } }
    </style>

  <!-- Set the launch identity before React or the game chunk downloads. -->
  <script>
    (() => {
      const fields = Array.from(document.head.querySelectorAll('[data-mesomon]'), node => {
        const attr = node.tagName === 'TITLE' ? null : node.tagName === 'LINK' ? 'href' : 'content';
        return { node, attr, original: attr ? node.getAttribute(attr) : node.textContent };
      });
      function update() {
        const active = /^\/mesomon\/?$/i.test(location.pathname);
        const pocket = /^\/dh-pocket\/?$/i.test(location.pathname);
        if (document.documentElement.hasAttribute('data-mesomon-console') === active &&
            document.documentElement.hasAttribute('data-pocket-console') === pocket) return;
        document.documentElement.toggleAttribute('data-pocket-console', pocket);
        document.documentElement.toggleAttribute('data-mesomon-console', active);
        fields.forEach(({ node, attr, original }) => {
          const value = active ? node.dataset.mesomon : (pocket && node.dataset.pocket) || original;
          if (attr) node.setAttribute(attr, value);
          else node.textContent = value;
        });
        if (active || pocket) {
          document.querySelector('meta[name="theme-color"]').content = '#102224';
          document.querySelector('meta[name="color-scheme"]').content = 'dark';
        }
      }
      update();
      document.addEventListener('dh:route-changed', update);
    })();
  </script>

  <!--
    BOOTSTRAP UPDATE PROBE — runs BEFORE any bundled JS.
    This breaks installed PWAs out of stale-SW limbo even when the cached
    JS bundle is broken or the old SW is intercepting everything.
    It uses a sessionStorage flag to avoid reload loops.
  -->
  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var forceKill = url.searchParams.has('fresh') || url.searchParams.has('kill');
        var alreadyNuked = sessionStorage.getItem('__dh_nuked__') === '1';
        function handheldOpen() {
          return document.documentElement.hasAttribute('data-mesomon-console') ||
            document.documentElement.hasAttribute('data-pocket-console');
        }
        var gameLaunch = handheldOpen();

        function nukeAll(reason) {
          if (alreadyNuked) return Promise.resolve();
          sessionStorage.setItem('__dh_nuked__', '1');
          console.warn('[DH bootstrap] Nuking SW + caches:', reason);
          var swPromise = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
              }).catch(function () {})
            : Promise.resolve();
          var cachePromise = ('caches' in window)
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); }));
              }).catch(function () {})
            : Promise.resolve();
          return Promise.all([swPromise, cachePromise]);
        }

        function reloadClean() {
          var u = new URL(window.location.href);
          u.searchParams.delete('fresh');
          u.searchParams.delete('kill');
          u.searchParams.set('_v', Date.now().toString());
          window.location.replace(u.toString());
        }

        function gameEntered() {
          var root = document.getElementById('root');
          return handheldOpen() &&
            (!gameLaunch || (root && root.hasChildNodes()) || document.querySelector('body > .mm-device'));
        }

        function recoverStaleBuild(reason) {
          // A cold, empty shell can recover. A slow version probe must never
          // interrupt someone who has already entered the handheld.
          if (!gameEntered()) {
            nukeAll(reason).then(function () { if (!gameEntered()) reloadClean(); });
          }
        }

        if (forceKill) {
          nukeAll('manual ?fresh/?kill').then(reloadClean);
          return;
        }

        // Probe version.json directly (no-store, cache-busted) to detect stale installs.
        // If the response is intercepted by an old SW returning HTML, JSON parse will fail
        // → treat as stale and nuke.
        fetch('/version.json?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'cache-control': 'no-cache', 'pragma': 'no-cache' }
        })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (txt) {
            if (!txt) return;
            try {
              var data = JSON.parse(txt);
              var remoteId = data && data.buildId;
              var lastSeen = localStorage.getItem('__dh_build_id__');
              if (remoteId && remoteId !== 'dev') {
                if (lastSeen && lastSeen !== remoteId && !alreadyNuked) {
                  // We previously saw a different build → SW is likely serving stale shell.
                  recoverStaleBuild('build mismatch ' + lastSeen + ' -> ' + remoteId);
                  return;
                }
                localStorage.setItem('__dh_build_id__', remoteId);
              }
            } catch (e) {
              // version.json was intercepted and returned non-JSON (probably HTML from old SW)
              if (!alreadyNuked) {
                recoverStaleBuild('version.json intercepted as non-JSON');
              }
            }
          })
          .catch(function () { /* offline — leave alone */ });

        // Proactively evict ANY service worker that isn't our minimal push SW.
        // This kills leftover Workbox SWs (sw.js, registerSW.js, etc.) on first
        // load of the new index.html, even before our self-destruct sw-push.js
        // gets a chance to run.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              try {
                var scriptUrl = (reg.active && reg.active.scriptURL) ||
                                (reg.waiting && reg.waiting.scriptURL) ||
                                (reg.installing && reg.installing.scriptURL) || '';
                if (scriptUrl && scriptUrl.indexOf('/sw-push.js') === -1) {
                  console.warn('[DH bootstrap] evicting non-push SW:', scriptUrl);
                  reg.unregister().catch(function () {});
                }
              } catch (e) {}
            });
          }).catch(function () {});
        }
      } catch (e) {
        console.error('[DH bootstrap] probe failed:', e);
      }
    })();
  </script>
